<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mabar Lokal - Daftar</title>
    <link rel="stylesheet" href="asset/css/output.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
  </head>
  <body class="flex min-h-screen items-center justify-center bg-bg text-white font-sans text-sm selection:bg-red selection:text-white p-4 lg:p-8">
    <div class="flex w-full max-w-[960px] flex-col overflow-hidden rounded-xl border border-border bg-card shadow-2xl md:flex-row">
      <!-- Left: Branding -->
      <div class="relative flex min-h-[250px] flex-1 flex-col items-center justify-center p-12 text-center md:min-h-[600px] md:border-r md:border-border">
        <div class="absolute top-1/2 left-1/2 h-[300px] w-[300px] -translate-x-1/2 -translate-y-1/2 rounded-full bg-red/20 blur-[100px] pointer-events-none"></div>
        <div class="relative z-10 text-[100px] text-red leading-none mb-6">
          <i class="ph-fill ph-shield"></i>
        </div>
        <h1 class="relative z-10 text-4xl font-black tracking-tight leading-none">
          MABAR<br/><span class="text-red">LOKAL</span>
        </h1>
      </div>
      <!-- Right: Form -->
      <div class="flex flex-1 flex-col justify-center p-8 md:p-12">
        <h2 class="text-[28px] font-bold text-white mb-8 tracking-tight">Daftar</h2>
        <form class="flex flex-col gap-5">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="flex flex-col gap-2">
              <label class="text-[12px] font-medium text-white">Nama</label>
              <input type="text" placeholder="Masukkan nama anda" class="rounded-md border border-border bg-bg px-4 py-3 text-[13px] text-white outline-none transition-colors focus:border-red placeholder:text-muted" />
            </div>
            <div class="flex flex-col gap-2">
              <label class="text-[12px] font-medium text-white">Alamat Email</label>
              <input type="email" placeholder="Masukkan email anda" class="rounded-md border border-border bg-bg px-4 py-3 text-[13px] text-white outline-none transition-colors focus:border-red placeholder:text-muted" />
            </div>
          </div>
          <div class="flex flex-col gap-2">
            <label class="text-[12px] font-medium text-white">Telepon</label>
            <input type="tel" placeholder="Masukkan kontak anda" class="rounded-md border border-border bg-bg px-4 py-3 text-[13px] text-white outline-none transition-colors focus:border-red placeholder:text-muted" />
          </div>
          <div class="flex flex-col gap-2">
            <label class="text-[12px] font-medium text-white">Kata Sandi</label>
            <div class="relative flex items-center">
              <input type="password" placeholder="Buat kata sandi" class="w-full rounded-md border border-border bg-bg pl-4 pr-10 py-3 text-[13px] text-white outline-none transition-colors focus:border-red placeholder:text-muted" />
              <button type="button" class="absolute right-3 text-muted hover:text-white transition-colors">
                <i class="ph ph-eye text-lg"></i>
              </button>
            </div>
          </div>
          <div class="flex flex-col gap-2 mb-2">
            <label class="text-[12px] font-medium text-white">Konfirmasi Kata Sandi</label>
            <div class="relative flex items-center">
              <input type="password" placeholder="Konfirmasi kata sandi" class="w-full rounded-md border border-border bg-bg pl-4 pr-10 py-3 text-[13px] text-white outline-none transition-colors focus:border-red placeholder:text-muted" />
              <button type="button" class="absolute right-3 text-muted hover:text-white transition-colors">
                <i class="ph ph-eye text-lg"></i>
              </button>
            </div>
          </div>
          <button type="button" onclick="window.location.href='index.html'" class="w-full rounded-md bg-red py-3 text-[13px] font-bold text-white transition-transform active:scale-[0.98] hover:bg-red-bright">
            Daftar
          </button>
        </form>
        <p class="mt-8 text-center text-[12px] text-muted">
          Sudah punya akun? <a href="login.html" class="font-bold text-white transition-colors hover:text-red">Masuk</a>
        </p>
      </div>
    </div>
  </body>
</html>
